name: DART news test (no repository writes)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Select and download disclosures
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python3 scripts/dart_news_test.py fetch
      - name: Summarize with Haiku low and verify numbers
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python3 scripts/dart_news_test.py summarize

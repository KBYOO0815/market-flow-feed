name: Publish reviewed featured stocks
on:
  push:
    branches: [main]
    paths:
      - 'drafts/featured-stocks.json'
      - 'scripts/featured_stocks.py'
      - 'scripts/publish_featured_stocks.py'
      - 'scripts/featured_watch.py'
      - 'scripts/test_featured_recovery.py'
      - 'scripts/test_featured_watch.py'
      - 'scripts/test_featured_stocks.py'
      - '.github/workflows/publish-featured-stocks.yml'
  schedule:
    - cron: '40 0,2,4,6 * * 1-5'
    - cron: '10 11 * * 1-5'
  workflow_run:
    workflows: ['Collect featured stocks on server']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: reviewed-featured-stocks-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'KBYOO0815/market-flow-feed' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate featured stocks pipeline
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Wait for release and publish reviewed featured stocks
        env:
          PUBLISH_TOKEN: ${{ github.token }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          COLLECTION_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 scripts/featured_watch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: featured-publication-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: operation-artifacts/
          if-no-files-found: warn
          retention-days: 7


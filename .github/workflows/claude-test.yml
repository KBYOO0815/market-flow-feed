name: Claude subscription test
on:
  workflow_dispatch:
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Call Haiku with low effort
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "CLAUDE_CODE_OAUTH_TOKEN secret is missing"; exit 1; fi
          status=0
          claude -p 'Classify this headline as one of: market, company, policy. Reply with the word only. Headline: Central bank keeps base rate unchanged' \
            --model claude-haiku-5-5 --effort low --tools "" --strict-mcp-config \
            --system-prompt 'You classify news headlines.' \
            --output-format json > out.json || status=$?
          jq '{is_error, result, usage, modelUsage}' out.json || cat out.json
          exit $status

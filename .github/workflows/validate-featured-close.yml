# 20:10 AFTER validator v2
name: Validate featured session market prices

on:
  push:
    paths:
      - 'featured-stocks.json'
      - 'featured-stocks/*.json'
      - 'scripts/check_featured_close.py'
      - 'scripts/test_check_featured_close.py'
      - 'scripts/featured_v3.py'
      - 'scripts/featured_naver_v3.py'
      - 'scripts/featured_integrated.py'
      - 'scripts/test_featured_v3_after.py'
      - '.github/workflows/validate-featured-close.yml'
  pull_request:
    paths:
      - 'featured-stocks.json'
      - 'featured-stocks/*.json'
      - 'scripts/check_featured_close.py'
      - 'scripts/test_check_featured_close.py'
      - 'scripts/featured_v3.py'
      - 'scripts/featured_naver_v3.py'
      - 'scripts/featured_integrated.py'
      - 'scripts/test_featured_v3_after.py'
      - '.github/workflows/validate-featured-close.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-session-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run session-source validation tests
        run: |
          python3 -m unittest discover -s scripts -p 'test_check_featured_close.py'
          python3 -m unittest discover -s scripts -p 'test_featured_v3_after.py'
      - name: Check published session prices and previous-close denominators
        run: python3 scripts/check_featured_close.py
